[package]
name = "sensepad"
version = "0.4.0"
edition = "2021"
authors = ["MarySue"]
description = "DualSense groovebox: pads, looper and DJ effects on a PS5 controller."
readme = "README.md"

[dependencies]
# OpenGL (glow) renderer: small binary, fast start, plenty for a 2D UI.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "accesskit"] }
cpal = "0.18"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
crc32fast = "1.4"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
